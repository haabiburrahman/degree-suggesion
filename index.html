<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { 
              return _currentFetch; 
            },
            set: function(fn) { 
              _currentFetch = fn; 
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Fetch descriptor initialization handled:', e);
        }
      })();
    </script>
